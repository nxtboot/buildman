[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "buildman"
version = "0.1.0"
authors = [
  { name="Simon Glass", email="sjg@chromium.org" },
]
description = "Build U-Boot for many boards and commits, and summarise the results"
readme = "README.rst"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
keywords = ["u-boot", "build", "firmware", "toolchain", "kconfig"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Embedded Systems",
    "Intended Audience :: Developers",
]
dependencies = [
    "filelock >= 3.0.12",
]

[project.optional-dependencies]
# Running the test suite (parallel test execution and coverage)
test = ["concurrencytest", "coverage"]

[project.urls]
Homepage = "https://github.com/nxtboot/buildman"
Documentation = "https://buildman.readthedocs.io/"
Repository = "https://github.com/nxtboot/buildman"
"Bug Tracker" = "https://github.com/nxtboot/buildman/issues"

[project.scripts]
buildman = "buildman.main:run_buildman"

[tool.setuptools.packages.find]
# buildman.test and its subdirs hold the test data, found as namespace packages.
# buildman._vendor holds the vendored libraries (see buildman/__init__.py)
include = ["buildman*"]

[tool.setuptools.package-data]
buildman = ["*.rst"]
"buildman.test" = ["**/*"]

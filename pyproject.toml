[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "buildman"
version = "0.0.7"
authors = [
  { name="Simon Glass", email="sjg@chromium.org" },
]
dependencies = [
    "filelock >= 3.0.12",
    "patch-manager >= 0.0.6"
]
description = "Buildman build tool for U-Boot"
readme = "README.rst"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Running the test suite (parallel test execution and coverage)
test = ["concurrencytest", "coverage"]

[project.urls]
"Homepage" = "https://docs.u-boot-project.org/en/latest/build/buildman.html"
"Bug Tracker" = "https://git.u-boot-project.org/groups/u-boot/-/issues"

[project.scripts]
buildman = "buildman.main:run_buildman"

[tool.setuptools.packages.find]
# buildman.test and its subdirs hold the test data, found as namespace packages.
# buildman._vendor holds the vendored libraries (see buildman/__init__.py)
include = ["buildman*"]

[tool.setuptools.package-data]
buildman = ["*.rst"]
"buildman.test" = ["**/*"]
